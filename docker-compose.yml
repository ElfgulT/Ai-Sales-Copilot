services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - COPILOT_ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/copilot.db
    volumes:
      - ./backend/data:/app/data   # SQLite veritabanını kalıcı hale getirir
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
